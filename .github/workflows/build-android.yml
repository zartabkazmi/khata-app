name: Build Android APK & AAB

# Run manually from the Actions tab whenever you want a fresh build.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Installs a known-good JDK 17 and sets JAVA_HOME reliably, instead of
      # relying on runner-image env vars (JAVA_HOME_17_X64 etc.) that can
      # differ between GitHub's Ubuntu images.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Point Bubblewrap at the JDK & Android SDK (non-interactive)
        # Writing Bubblewrap's own config file directly, instead of running
        # `bubblewrap updateConfig` interactively — its prompts don't behave
        # reliably when piped input in a non-TTY CI shell.
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"

      - name: Bridge modern Android SDK layout to what Bubblewrap expects
        # GitHub's runner ships the SDK with only cmdline-tools/*/bin/sdkmanager.
        # Bubblewrap looks for the older tools/bin/sdkmanager (or bin/sdkmanager)
        # layout, so we add a compatibility symlink pointing at the real one.
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 2 -name sdkmanager | head -n 1)
          echo "Found sdkmanager at: $SDKMANAGER"
          mkdir -p "$ANDROID_HOME/tools/bin"
          ln -sf "$SDKMANAGER" "$ANDROID_HOME/tools/bin/sdkmanager"
          ls -la "$ANDROID_HOME/tools/bin"

      - name: Restore signing keystore from secret
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Build signed APK + AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        # `yes ''` auto-accepts Bubblewrap's "regenerate project from manifest?" prompt
        # (its default answer is already yes — this just skips the interactive wait).
        run: yes '' | bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: khata-app-release.apk
          path: app-release-signed.apk

      - name: Upload AAB (for Play Store upload)
        uses: actions/upload-artifact@v4
        with:
          name: khata-app-release.aab
          path: app-release-bundle.aab
